<script>
/* ---------- INTERPRETADOR PORTUGOL ---------- */
function tok(s){const r=/\s*("[^"]*"|<-|:=|<=|>=|<>|\d+\.\d+|\d+|[A-Za-zÀ-ÿ_][A-Za-zÀ-ÿ_0-9]*|[-+*\/^(),<>=%:\[\]])/gy;let t=[],m;r.lastIndex=0;while(r.lastIndex<s.length){m=r.exec(s);if(!m)throw"Caractere inválido em: "+s.slice(r.lastIndex);t.push(m[1]);}return t;}
function Ev(t,V){let i=0;
 const pk=()=>t[i],ea=v=>{if((t[i]||'').toLowerCase()!==v)throw"Esperado '"+v+"'";i++;};
 function pri(){let x=t[i++];if(x===undefined)throw"Expressão incompleta";
  if(x==='(' ){let v=or();ea(')');return v;}
  if(x==='-')return -pri();
  if(/^"/.test(x))return x.slice(1,-1);
  if(/^\d/.test(x))return parseFloat(x);
  const k=x.toLowerCase();
  if(k==='nao')return !pri();
  if(k==='verdadeiro')return true;if(k==='falso')return false;if(k==='pi')return Math.PI;
  if(t[i]==='('){i++;let a=[];if(t[i]!==')'){a.push(or());while(t[i]===','){i++;a.push(or());}}ea(')');
   const F={raizq:Math.sqrt,abs:Math.abs,int:Math.trunc,sen:Math.sin,cos:Math.cos,tan:Math.tan,exp:(b,e)=>Math.pow(b,e),quad:x=>x*x};
   if(!F[k])throw"Função desconhecida: "+x;return F[k](...a);}
  if(t[i]==='['){i++;let idx=or();ea(']');if(!(k in V))throw"Vetor não declarado: "+x;
   const arr=V[k];if(!Array.isArray(arr))throw x+" não é um vetor";return arr[Math.trunc(idx)];}
  if(!(k in V))throw"Variável não declarada: "+x;return V[k];}
 function pw(){let a=pri();while(t[i]==='^'){i++;a=Math.pow(a,pri());}return a;}
 function mu(){let a=pw();for(;;){let o=(t[i]||'').toLowerCase();if(o==='*'||o==='/'){i++;let b=pw();a=o==='*'?a*b:a/b;}else if(o==='div'){i++;a=Math.trunc(a/pw());}else if(o==='mod'||o==='%'){i++;a=a%pw();}else return a;}}
 function ad(){let a=mu();for(;;){let o=t[i];if(o==='+'||o==='-'){i++;let b=mu();a=o==='+'?(typeof a==='string'||typeof b==='string'?String(a)+String(b):a+b):a-b;}else return a;}}
 function cp(){let a=ad();let o=t[i];if(['=','<','>','<=','>=','<>'].includes(o)){i++;let b=ad();return o==='='?a===b:o==='<>'?a!==b:o==='<'?a<b:o==='>'?a>b:o==='<='?a<=b:a>=b;}return a;}
 function an(){let a=cp();while((t[i]||'').toLowerCase()==='e'){i++;a=a&&cp();}return a;}
 function or(){let a=an();while((t[i]||'').toLowerCase()==='ou'){i++;a=a||an();}return a;}
 let v=or();return v;}
const ev=(s,V)=>Ev(tok(s),V);
function split(s){let d=0,q=false,r=[],c='';for(const ch of s){if(ch==='"')q=!q;if(!q&&(ch==='('||ch==='['))d++;if(!q&&(ch===')'||ch===']'))d--;if(!q&&d===0&&ch===','){r.push(c);c='';}else c+=ch;}if(c.trim())r.push(c);return r;}
function fmt(a,V){let d=0,q=false,base=a,dec=null;for(let j=0;j<a.length;j++){const ch=a[j];if(ch==='"')q=!q;if(!q&&ch==='(')d++;if(!q&&ch===')')d--;if(!q&&d===0&&ch===':'){base=a.slice(0,j);dec=a.slice(j+1).split(':').pop();break;}}
 let v=ev(base,V);if(dec!==null&&typeof v==='number')return v.toFixed(parseInt(dec));
 if(typeof v==='number')return Number.isInteger(v)?String(v):String(parseFloat(v.toFixed(6)));
 if(typeof v==='boolean')return v?'VERDADEIRO':'FALSO';return String(v);}
const OPEN=['se','enquanto','para','repita','escolha'],CLOSE=['fimse','fimenquanto','fimpara','ate','fimescolha'];
function match(L,i){let d=0;for(let j=i;j<L.length;j++){const w=(L[j].split(/[\s(]/)[0]||'').toLowerCase();
 if(OPEN.includes(w))d++;if(CLOSE.includes(w)){d--;if(d===0)return j;}}throw"Bloco sem fechamento na linha "+(i+1);}
function elseAt(L,a,b){let d=0;for(let j=a;j<b;j++){const w=(L[j].split(/[\s(]/)[0]||'').toLowerCase();if(OPEN.includes(w))d++;if(CLOSE.includes(w))d--;if(d===1&&w==='senao')return j;}return -1;}
function portugol(src,input){
 const O=[];let steps=0;const IN=input.split('\n').filter(x=>x.trim()!=='' ).map(x=>x.trim());let ip=0;
 let L=src.split('\n').map(l=>l.replace(/\/\/.*/,'').replace(/←/g,'<-').trim()).filter(l=>l!=='');
 const V={};
 const vi=L.findIndex(l=>/^var$/i.test(l)),si=L.findIndex(l=>/^inicio$/i.test(l));
 if(vi>=0&&si>vi)for(const l of L.slice(vi+1,si)){const m=l.split(':');if(m.length<2)continue;const t=m.slice(1).join(':').trim();
  const vm=t.match(/^vetor\s*\[\s*(\d+)\s*(?:\.\.\s*(\d+))?\s*\]\s*de\s*(\w+)/i);
  m[0].split(',').forEach(n=>{n=n.trim().toLowerCase();if(!n)return;
   if(vm){const hi=vm[2]?parseInt(vm[2]):parseInt(vm[1]);const tp=vm[3].toLowerCase();
    const def=/caracter|literal/.test(tp)?'':/logico/.test(tp)?false:0;V[n]=new Array(hi+1).fill(def);}
   else{const tt=t.toLowerCase();V[n]=/caracter|literal/.test(tt)?'':/logico/.test(tt)?false:0;}});}
 let fi=L.findIndex(l=>/^fimalgoritmo$/i.test(l));
 run(L.slice(si+1,fi<0?L.length:fi));
 function run(B){for(let i=0;i<B.length;i++){if(++steps>400000)throw"Execução muito longa (possível laço infinito)";
  const l=B[i],w=(l.split(/[\s(]/)[0]||'').toLowerCase();
  if(w==='escreva'||w==='escreval'){const a=l.slice(l.indexOf('(')+1,l.lastIndexOf(')'));
   O.push(a.trim()?split(a).map(x=>fmt(x.trim(),V)).join(''):'');if(w==='escreval')O.push('\n');continue;}
  if(w==='leia'){const a=l.slice(l.indexOf('(')+1,l.lastIndexOf(')'));
   split(a).forEach(n=>{n=n.trim();if(ip>=IN.length)throw"Faltam valores na caixa de Entrada";
    const s=IN[ip++];const val=(s!==''&&!isNaN(Number(s.replace(',','.'))))?Number(s.replace(',','.')):s;
    const am=n.match(/^([A-Za-zÀ-ÿ_][A-Za-zÀ-ÿ_0-9]*)\s*\[\s*(.+?)\s*\]$/);
    if(am){const nm=am[1].toLowerCase();if(!Array.isArray(V[nm]))throw nm+" não é um vetor";V[nm][Math.trunc(ev(am[2],V))]=val;}
    else V[n.toLowerCase()]=val;});continue;}
  if(w==='se'){const e=match(B,i),cond=l.replace(/^se\s+/i,'').replace(/\s*entao\s*$/i,'');
   const sp=elseAt(B,i,e);
   if(ev(cond,V))run(B.slice(i+1,sp<0?e:sp));else if(sp>=0)run(B.slice(sp+1,e));
   i=e;continue;}
  if(w==='enquanto'){const e=match(B,i),c=l.replace(/^enquanto\s+/i,'').replace(/\s*faca\s*$/i,''),bd=B.slice(i+1,e);
   while(ev(c,V)){run(bd);if(++steps>400000)throw"Laço infinito";}i=e;continue;}
  if(w==='repita'){const e=match(B,i),bd=B.slice(i+1,e),c=B[e].replace(/^ate\s+/i,'');
   do{run(bd);if(++steps>400000)throw"Laço infinito";}while(!ev(c,V));i=e;continue;}
  if(w==='para'){const e=match(B,i),m=l.match(/^para\s+([A-Za-zÀ-ÿ_0-9]+)\s+de\s+(.+?)\s+ate\s+(.+?)(?:\s+passo\s+(.+?))?\s+faca$/i);
   if(!m)throw"Sintaxe inválida em: "+l;const n=m[1].toLowerCase(),a=ev(m[2],V),b=ev(m[3],V),p=m[4]?ev(m[4],V):1,bd=B.slice(i+1,e);
   for(V[n]=a;p>0?V[n]<=b:V[n]>=b;V[n]+=p){run(bd);if(++steps>400000)throw"Laço infinito";}i=e;continue;}
  if(/^(algoritmo|var|inicio|fimalgoritmo)\b/i.test(l))continue;
  const as=l.match(/^([A-Za-zÀ-ÿ_][A-Za-zÀ-ÿ_0-9]*)\s*(?:\[\s*(.+?)\s*\])?\s*(?:<-|:=)\s*(.+)$/);
  if(as){const nm=as[1].toLowerCase();
   if(as[2]!==undefined){if(!Array.isArray(V[nm]))throw nm+" não é um vetor";V[nm][Math.trunc(ev(as[2],V))]=ev(as[3],V);}
   else V[nm]=ev(as[3],V);
   continue;}
  throw"Comando não reconhecido: "+l;}}
 return O.join('');}
/* ---------- EXERCÍCIOS ---------- */
const EX={manzano:[
{t:"L01A — Celsius para Fahrenheit",s:"Ler uma temperatura em graus Celsius e apresentá-la convertida em Fahrenheit. fahrenheit ← (9*celsius+160)/5.",i:"30",c:`algoritmo "L01A"
var
   celsius, fahrenheit: real
inicio
   Escreva("Temperatura em Celsius: ")
   Leia(celsius)
   fahrenheit <- (9 * celsius + 160) / 5
   Escreval("Em Fahrenheit: ", fahrenheit:2)
fimalgoritmo`},
{t:"L01C — Volume de uma lata de óleo",s:"Calcular e apresentar o volume de uma lata cilíndrica: Volume ← PI * Raio² * Altura.",i:"5\n12",c:`algoritmo "L01C"
var
   raio, altura, volume: real
inicio
   Escreva("Raio (cm): ")
   Leia(raio)
   Escreva("Altura (cm): ")
   Leia(altura)
   volume <- pi * raio * raio * altura
   Escreval("Volume da lata: ", volume:2, " cm3")
fimalgoritmo`},
{t:"L01D — Litros gastos em uma viagem",s:"Ler tempo e velocidade média, calcular a distância (tempo*velocidade) e os litros gastos (distância/12).",i:"3\n80",c:`algoritmo "L01D"
var
   tempo, velocidade, distancia, litros: real
inicio
   Escreva("Tempo gasto (h): ")
   Leia(tempo)
   Escreva("Velocidade media (km/h): ")
   Leia(velocidade)
   distancia <- tempo * velocidade
   litros <- distancia / 12
   Escreval("Velocidade media: ", velocidade:2, " km/h")
   Escreval("Tempo gasto...: ", tempo:2, " h")
   Escreval("Distancia.....: ", distancia:2, " km")
   Escreval("Litros usados.: ", litros:2, " L")
fimalgoritmo`},
{t:"L01F — Troca de valores entre A e B",s:"Ler dois valores e trocar o conteúdo das variáveis, apresentando os valores trocados.",i:"10\n25",c:`algoritmo "L01F"
var
   valorA, valorB, auxiliar: real
inicio
   Escreva("Valor de valorA: ")
   Leia(valorA)
   Escreva("Valor de valorB: ")
   Leia(valorB)
   auxiliar <- valorA
   valorA <- valorB
   valorB <- auxiliar
   Escreval("Agora valorA = ", valorA)
   Escreval("Agora valorB = ", valorB)
fimalgoritmo`},
{t:"L01H — Volume de uma caixa retangular",s:"VOLUME ← COMPRIMENTO * LARGURA * ALTURA.",i:"4\n3\n2",c:`algoritmo "L01H"
var
   comprimento, largura, altura, volume: real
inicio
   Escreva("Comprimento: ")
   Leia(comprimento)
   Escreva("Largura: ")
   Leia(largura)
   Escreva("Altura: ")
   Leia(altura)
   volume <- comprimento * largura * altura
   Escreval("Volume da caixa: ", volume:2)
fimalgoritmo`},
{t:"L01J — Conversão de dólar para real",s:"Ler a cotação do dólar e a quantidade de dólares, apresentando o valor em moeda brasileira.",i:"5.40\n200",c:`algoritmo "L01J"
var
   cotacao, dolares, reais: real
inicio
   Escreva("Cotacao do dolar: ")
   Leia(cotacao)
   Escreva("Quantidade de dolares: ")
   Leia(dolares)
   reais <- dolares * cotacao
   Escreval("Valor em reais: R$ ", reais:2)
fimalgoritmo`},
{t:"L02C — Média de quatro notas (aprovado ≥ 5)",s:"Ler quatro notas, calcular a média e informar se o aluno foi aprovado.",i:"7\n5\n6\n4",c:`algoritmo "L02C"
var
   nota1, nota2, nota3, nota4, media: real
inicio
   Leia(nota1)
   Leia(nota2)
   Leia(nota3)
   Leia(nota4)
   media <- (nota1 + nota2 + nota3 + nota4) / 4
   se media >= 5 entao
      Escreval("Aluno APROVADO com media ", media:2)
   senao
      Escreval("Aluno REPROVADO com media ", media:2)
   fimse
fimalgoritmo`},
{t:"L02E — Equação do 2º grau",s:"Ler coefA, coefB e coefC e calcular as duas raízes, validando coefA ≠ 0 e delta ≥ 0.",i:"1\n-5\n6",c:`algoritmo "L02E"
var
   coefA, coefB, coefC, delta, raiz1, raiz2: real
inicio
   Leia(coefA)
   Leia(coefB)
   Leia(coefC)
   se coefA = 0 entao
      Escreval("CoefA deve ser diferente de zero.")
   senao
      delta <- coefB * coefB - 4 * coefA * coefC
      se delta < 0 entao
         Escreval("Nao existem raizes reais.")
      senao
         raiz1 <- (-coefB + raizq(delta)) / (2 * coefA)
         raiz2 <- (-coefB - raizq(delta)) / (2 * coefA)
         Escreval("Raiz1 = ", raiz1:2)
         Escreval("Raiz2 = ", raiz2:2)
      fimse
   fimse
fimalgoritmo`},
{t:"L02I — Número par ou ímpar",s:"Ler um número inteiro e informar se ele é par ou ímpar.",i:"17",c:`algoritmo "L02I"
var
   numero: inteiro
inicio
   Escreva("Numero: ")
   Leia(numero)
   se numero mod 2 = 0 entao
      Escreval(numero, " e PAR")
   senao
      Escreval(numero, " e IMPAR")
   fimse
fimalgoritmo`},
{t:"L03A — Tabuada (estrutura enquanto)",s:"Apresentar a tabuada de multiplicar de 1 até 10 de um número qualquer.",i:"7",c:`algoritmo "L03A"
var
   numero, contador: inteiro
inicio
   Escreva("Numero: ")
   Leia(numero)
   contador <- 1
   enquanto contador <= 10 faca
      Escreval(numero, " x ", contador, " = ", numero * contador)
      contador <- contador + 1
   fimenquanto
fimalgoritmo`},
{t:"L03G — Série de Fibonacci (15 termos)",s:"Apresentar a série de Fibonacci até o décimo quinto termo usando enquanto.",i:"",c:`algoritmo "L03G"
var
   anterior, atual, proximo, contador: inteiro
inicio
   anterior <- 1
   atual <- 1
   Escreva(anterior, " ", atual, " ")
   contador <- 3
   enquanto contador <= 15 faca
      proximo <- anterior + atual
      Escreva(proximo, " ")
      anterior <- atual
      atual <- proximo
      contador <- contador + 1
   fimenquanto
   Escreval("")
fimalgoritmo`},
{t:"L04D — Grãos de trigo no tabuleiro (repita)",s:"Somatório dos grãos em 64 casas, dobrando a quantidade a cada casa.",i:"",c:`algoritmo "L04D"
var
   casa: inteiro
   graos, total: real
inicio
   casa <- 1
   graos <- 1
   total <- 0
   repita
      total <- total + graos
      graos <- graos * 2
      casa <- casa + 1
   ate casa > 64
   Escreval("Total de graos: ", total)
fimalgoritmo`},
{t:"L04J — Divisão inteira sem usar DIV",s:"Apresentar o quociente inteiro de dois números usando apenas looping.",i:"47\n5",c:`algoritmo "L04J"
var
   dividendo, divisor, quociente, resto: inteiro
inicio
   Leia(dividendo)
   Leia(divisor)
   quociente <- 0
   resto <- dividendo
   repita
      se resto >= divisor entao
         resto <- resto - divisor
         quociente <- quociente + 1
      fimse
   ate resto < divisor
   Escreval("Quociente: ", quociente)
   Escreval("Resto....: ", resto)
fimalgoritmo`},
{t:"L05K — Fatorial dos ímpares de 1 a 10 (para)",s:"Apresentar o valor do fatorial de cada valor ímpar na faixa de 1 a 10.",i:"",c:`algoritmo "L05K"
var
   contador, subContador: inteiro
   fatorial: real
inicio
   para contador de 1 ate 10 passo 1 faca
      se contador mod 2 <> 0 entao
         fatorial <- 1
         para subContador de 1 ate contador passo 1 faca
            fatorial <- fatorial * subContador
         fimpara
         Escreval(contador, "! = ", fatorial)
      fimse
   fimpara
fimalgoritmo`},
{t:"Intro A — Produto e soma de quatro valores",s:"Ler A, B, C e D; apresentar o produto (P) do primeiro com o terceiro e a soma (S) do segundo com o quarto.",i:"2\n3\n4\n5",c:`algoritmo "IntroA"
var
   valorA, valorB, valorC, valorD, produto, soma: inteiro
inicio
   Leia(valorA)
   Leia(valorB)
   Leia(valorC)
   Leia(valorD)
   produto <- valorA * valorC
   soma <- valorB + valorD
   Escreval("Produto = ", produto)

   Leia(nota2)

   Leia(valorB)

      valorA <- valorB
      valorB <- auxiliar
   fimse

      valorB <- valorC
      valorC <- auxiliar
   fimse

{t:"Ex. 36 — Idades de dois homens e duas mulheres",s:"Somar a idade do homem mais velho com a mulher mais nova e multiplicar o homem mais novo pela mulher mais velha.",i:"45\n30\n50\n25",c:`algoritmo "Ex36"
var
   idadeHomem1, idadeHomem2, idadeMulher1, idadeMulher2, homemVelho, homemNovo, mulherVelha, mulherNova, soma, produto: real
inicio

   Leia(idadeHomem2)
   Leia(idadeMulher1)
   Leia(idadeMulher2)
   se idadeHomem1 > idadeHomem2 entao
      homemVelho <- idadeHomem1
      homemNovo <- idadeHomem2
   senao

      homemNovo <- idadeHomem1
   fimse
   se idadeMulher1 > idadeMulher2 entao
      mulherVelha <- idadeMulher1
      mulherNova <- idadeMulher2
   senao
      mulherVelha <- idadeMulher2
      mulherNova <- idadeMulher1
   fimse
   soma <- homemVelho + mulherNova
   produto <- homemNovo * mulherVelha
   Escreval("Soma (homem mais velho + mulher mais nova): ", soma)
   Escreval("Produto (homem mais novo x mulher mais velha): ", produto)

var
   numeroHabitantes, contador, filhos, somaFilhos, contadorMenor: inteiro
   salario, somaSalarios, maiorSalario, mediaSalario, mediaFilhos, percentualMenor: real
inicio
   Escreva("Numero de habitantes: ")
   Leia(numeroHabitantes)
   somaSalarios <- 0
   somaFilhos <- 0
   contadorMenor <- 0
   para contador de 1 ate numeroHabitantes passo 1 faca
      Leia(salario)
      Leia(filhos)
      somaSalarios <- somaSalarios + salario
      somaFilhos <- somaFilhos + filhos
      se (contador = 1) ou (salario > maiorSalario) entao
         maiorSalario <- salario
      fimse
      se salario < 150 entao
         contadorMenor <- contadorMenor + 1
      fimse
   fimpara
   mediaSalario <- somaSalarios / numeroHabitantes
   mediaFilhos <- somaFilhos / numeroHabitantes
   percentualMenor <- contadorMenor * 100 / numeroHabitantes
   Escreval("Media de salario..: R$ ", mediaSalario:2)
   Escreval("Media de filhos...: ", mediaFilhos:2)
   Escreval("Maior salario.....: R$ ", maiorSalario:2)
   Escreval("Percentual < R$150: ", percentualMenor:2, " %")
fimalgoritmo`},

{t:"Ex. 85 — Menor, maior, média anual e dias abaixo da média",s:"Ler a temperatura de todos os dias do ano (aqui, uma quantidade N informada pelo usuário) e calcular menor, maior, média e dias abaixo da média.",i:"7\n22\n25\n19\n30\n18\n24\n21",c:`algoritmo "Ex85"
var
   temperaturas: vetor[1..400] de real
   totalDias, contador, diasAbaixo: inteiro
   soma, media, menor, maior: real
inicio
   Escreva("Quantidade de dias a informar: ")
   Leia(totalDias)
   soma <- 0
   para contador de 1 ate totalDias passo 1 faca
      Leia(temperaturas[contador])
      soma <- soma + temperaturas[contador]
      se (contador = 1) ou (temperaturas[contador] > maior) entao
         maior <- temperaturas[contador]
      fimse
      se (contador = 1) ou (temperaturas[contador] < menor) entao
         menor <- temperaturas[contador]
      fimse
   fimpara
   media <- soma / totalDias
   diasAbaixo <- 0
   para contador de 1 ate totalDias passo 1 faca
      se temperaturas[contador] < media entao
         diasAbaixo <- diasAbaixo + 1
      fimse
   fimpara
   Escreval("Menor temperatura..: ", menor:2)
   Escreval("Maior temperatura..: ", maior:2)
   Escreval("Media anual........: ", media:2)
   Escreval("Dias abaixo da media: ", diasAbaixo)
fimalgoritmo`}]};
/* ---------- UI ---------- */
let sec='manzano',idx=0;
const $=id=>document.getElementById(id);
function setSec(s){sec=s;idx=0;$('tM').className=s==='manzano'?'on':'';$('tF').className=s==='faccat'?'on':'';render();}
function grp(t){const p=t.split(/\s/)[0];return /^L0\d/.test(p)?"Lista "+p.slice(0,3):"Exercícios introdutórios";}
function render(){const L=EX[sec];let h='',g='';
 L.forEach((e,i)=>{if(sec==='manzano'){const G=grp(e.t);if(G!==g){g=G;h+=`<div class="grp">${G}</div>`;}}
  h+=`<li data-i="${i}" onclick="load(${i})">${e.t}</li>`;});
 $('list').innerHTML=h;load(idx);}
function load(i){idx=i;const e=EX[sec][i];
 $('src').textContent=sec==='manzano'?'Manzano · Estudo Dirigido de Algoritmos':'Faccat · Apostila de Lógica de Programação';
 $('ttl').textContent=e.t;$('stm').textContent=e.s;$('code').value=e.c;$('stdin').value=e.i;$('out').textContent='—';
 document.querySelectorAll('#list li').forEach(li=>li.className=(+li.dataset.i===i)?'on':'');}
function go(d){const L=EX[sec];idx=(idx+d+L.length)%L.length;load(idx);}
function exec(){try{const r=portugol($('code').value,$('stdin').value);$('out').textContent=r.trim()===''?'(sem saída)':r;}
 catch(err){$('out').textContent='⚠ Erro: '+err;}}
EX.manzano.sort((a,b)=>a.t.localeCompare(b.t,'pt'));
EX.faccat.sort((a,b)=>parseInt(a.t.match(/\d+/)[0])-parseInt(b.t.match(/\d+/)[0]));
render();
document.addEventListener('keydown',e=>{if(e.ctrlKey&&e.key==='Enter')exec();});
</script></body></html>
